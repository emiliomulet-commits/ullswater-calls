name: Tenders probe (phase 1, measure F&T + TED volume)
on:
  push:
    branches: ["claude/**"]
    paths: ["tenders/**", ".github/workflows/tenders-probe.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tenders/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe-report
          path: tenders/probe-report.json

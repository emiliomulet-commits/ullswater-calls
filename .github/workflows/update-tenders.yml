name: Daily update of EU tenders (tenders.ullswaterinvestments.com)

on:
  schedule:
    - cron: "41 5 * * *"   # every day 05:41 UTC, after the calls update
    - cron: "11 14 * * *"  # second run: TED publishes new notices every working day
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths: ["tenders/**", ".github/workflows/update-tenders.yml"]

concurrency:
  group: tenders-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache of the previous run (keeps the site alive if a source is down)
        uses: actions/cache@v4
        with:
          path: .cache/tenders
          key: tenders-${{ github.run_id }}
          restore-keys: tenders-

      - name: Fetch tenders (EU Funding & Tenders Portal + TED)
        run: python tenders/fetch_tenders.py

      - name: Fetch Spanish tenders by level of government (Plataforma de Contratación del Sector Público)
        continue-on-error: true
        timeout-minutes: 120
        env:
          PYTHONUNBUFFERED: "1"
        run: python tenders/fetch_spain.py

      - name: Spanish contract awards (competition data for the free diagnosis)
        continue-on-error: true
        timeout-minutes: 60
        env:
          PYTHONUNBUFFERED: "1"
        run: python tenders/awards_spain.py

      - name: Build the site (EN + ES)
        run: python tenders/build_tenders.py

      - name: Data version marker
        run: |
          python - <<'PY'
          import json, os, datetime
          v = f"{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          json.dump({"v": v, "built": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")}, open("site-tenders/data/version.json", "w"))
          PY
          echo "files: $(find site-tenders -type f | wc -l), size: $(du -sh site-tenders | cut -f1)"
          ls -S -l site-tenders/data/ted | head -6; ls -l site-tenders/data/eu.json
          python -c "import json;s=json.load(open('site-tenders/data/es/stats.json'));print(json.dumps({k:v for k,v in s.items() if k!='provinces'},ensure_ascii=False))" || true
          python -c "import json;e=json.load(open('site-tenders/data/eu.json'));print(json.dumps(e[:3],ensure_ascii=False,indent=1));s=json.load(open('site-tenders/data/ted/ESP.json'));print(json.dumps(s[:3],ensure_ascii=False,indent=1));from collections import Counter;print('eu nature',Counter(x['nature'] for x in e),'eu deadline none',sum(1 for x in e if not x['deadline']));print('esp no title_es',sum(1 for x in s if 'title_es' not in x),'of',len(s))"

      - name: Preview artifact (branch runs only)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-tenders
          path: site-tenders
          retention-days: 5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Preview deploy of a branch (ullswater-tenders-preview.<account>.workers.dev, never the live domain)
        if: github.ref != 'refs/heads/main' && env.CF_TOKEN != ''
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: tenders/worker
        run: npx --yes wrangler@4 deploy --config wrangler.nodomain.toml --name ullswater-tenders-preview

      - name: Deploy to tenders.ullswaterinvestments.com (Workers Static Assets)
        id: deploy
        if: github.ref == 'refs/heads/main' && env.CF_TOKEN != ''
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: tenders/worker
        run: npx --yes wrangler@4 deploy

      - name: Deploy without the custom domain if the token cannot manage it (site stays on workers.dev)
        if: github.ref == 'refs/heads/main' && env.CF_TOKEN != '' && steps.deploy.outcome == 'failure'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: tenders/worker
        run: |
          npx --yes wrangler@4 deploy --config wrangler.nodomain.toml
          echo "::warning::Deployed to ullswater-tenders.<account>.workers.dev. Add the custom domain tenders.ullswaterinvestments.com in Cloudflare → Workers → ullswater-tenders → Settings → Domains & Routes."

      - name: Missing token
        if: github.ref == 'refs/heads/main' && env.CF_TOKEN == ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "::warning::Add the CLOUDFLARE_API_TOKEN secret to deploy tenders.ullswaterinvestments.com."

      - name: Notify IndexNow of new pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'push'
        continue-on-error: true
        run: python scripts/indexnow.py site-tenders/sitemap.xml tenders.ullswaterinvestments.com

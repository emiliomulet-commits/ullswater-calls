name: Deploy the ullswater-ai Worker (chat assistant, AI pre-check, Fund Finder search)

on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the widget is embedded and the code parses
        run: |
          python3 worker/embed_widget.py
          git diff --exit-code worker/ullswater-ai.js || (echo "Run worker/embed_widget.py and commit the result" && exit 1)
          node --check worker/ullswater-ai.js
      - name: Deploy with wrangler (needs the CLOUDFLARE_API_TOKEN secret)
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
      - name: Smoke test
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          sleep 10
          curl -fsS https://ullswater-ai.emilio-mulet-b52.workers.dev/ | grep -q widget.js
          curl -fsS https://ullswater-ai.emilio-mulet-b52.workers.dev/widget.js | grep -q "Asistente de ayudas"
          echo "Worker live"
      - name: Missing token
        if: ${{ env.CF_TOKEN == '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "::warning::Add the CLOUDFLARE_API_TOKEN secret (template 'Edit Cloudflare Workers') to deploy the Worker automatically."

name: Probe Spanish tenders feed (PLACSP)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe-spain.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tenders/fetch_spain.py 2>&1 | grep -a "tag inventory" | tr ',' '\n' | sort -u | head -1500
        env:
          SPAIN_PROBE: "1"
          SPAIN_NO_ZIP: "1"
          SPAIN_DAYS_BACK: "1"
          SPAIN_MAX_PAGES: "2"
          PYTHONUNBUFFERED: "1"

name: Probe Spanish tenders feed (PLACSP)

on:
  push:
    branches: ["claude/**"]
    paths: ["tenders/fetch_spain.py", ".github/workflows/probe-spain.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Monthly zips (size and speed)
        run: |
          for f in sindicacion_643/licitacionesPerfilesContratanteCompleto3_202611.zip sindicacion_643/licitacionesPerfilesContratanteCompleto3_202610.zip sindicacion_1044/PlataformasAgregadasSinMenores_202611.zip sindicacion_1044/PlataformasAgregadasSinMenores_202610.zip; do
            u=https://contrataciondelsectorpublico.gob.es/sindicacion/$f
            curl -sS -I -m 60 "$u" | grep -i "HTTP/\|content-length\|last-modified" || echo "HEAD FAIL $f"
          done
          u=https://contrataciondelsectorpublico.gob.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3_202611.zip
          curl -sS -m 900 -o /tmp/m.zip -w "GET %{http_code} %{size_download} bytes %{time_total}s %{speed_download} B/s\n" "$u" || echo GET FAIL
          unzip -l /tmp/m.zip | head -5; unzip -l /tmp/m.zip | tail -3
      - name: Probe (a few pages of each feed)
        if: false
        timeout-minutes: 15
        env:
          SPAIN_PROBE: "1"
          PYTHONUNBUFFERED: "1"
          SPAIN_DAYS_BACK: "2"
          SPAIN_MAX_PAGES: "8"
        run: python tenders/fetch_spain.py

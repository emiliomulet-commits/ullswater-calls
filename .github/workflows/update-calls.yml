name: Daily update of EU funding calls

on:
  schedule:
    - cron: "7 5 * * *"    # every day 05:07 UTC (06:07 Madrid in winter): calls, partner matches and approved partner requests
    - cron: "37 12 * * *"  # backup run in case GitHub drops the morning schedule
  workflow_dispatch:       # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pandas numpy scikit-learn

      - name: Fetch calls from the EU Funding & Tenders Portal API
        run: python scripts/fetch_calls.py

      - name: Month key for the CORDIS cache
        id: month
        run: echo "key=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache CORDIS open data (refreshed monthly by the Commission)
        uses: actions/cache@v4
        with:
          path: .cache/cordis
          key: cordis-${{ steps.month.outputs.key }}

      - name: Match calls with organisations (CORDIS)
        run: python scripts/partners.py

      - name: Cache BDNS call details
        uses: actions/cache@v4
        with:
          path: .cache/bdns
          key: bdns-${{ github.run_id }}
          restore-keys: bdns-

      - name: Spanish national and regional calls (BDNS)
        run: python scripts/bdns.py
        continue-on-error: true

      - name: Fund Finder index
        run: python scripts/finder_index.py

      - name: Build static site
        run: python scripts/build_site.py

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "ullswater-calls-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Daily calls update $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow of new pages (Bing and others)
        if: github.event_name != 'push'
        run: |
          python scripts/indexnow.py site/sitemap.xml calls.ullswaterinvestments.com site/data/indexnow_seen.txt
          git add site/data/indexnow_seen.txt
          git diff --cached --quiet || (git commit -m "IndexNow: record notified URLs" && git pull --rebase -X theirs && git push)

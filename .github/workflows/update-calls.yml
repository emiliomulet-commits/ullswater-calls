name: Daily update of EU funding calls

on:
  schedule:
    - cron: "0 5 * * *"   # every day 05:00 UTC (06:00 Madrid in winter): calls, partner matches and approved partner requests
  workflow_dispatch:       # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pandas numpy scikit-learn

      - name: Fetch calls from the EU Funding & Tenders Portal API
        run: python scripts/fetch_calls.py

      - name: Month key for the CORDIS cache
        id: month
        run: echo "key=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache CORDIS open data (refreshed monthly by the Commission)
        uses: actions/cache@v4
        with:
          path: .cache/cordis
          key: cordis-${{ steps.month.outputs.key }}

      - name: Match calls with organisations (CORDIS)
        run: python scripts/partners.py

      - name: Build static site
        run: python scripts/build_site.py

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "ullswater-calls-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Weekly calls update $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
